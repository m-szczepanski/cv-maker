name: diy
description: Configurable layout engine — edit config.typ (or extract with `cv templates --extract diy`).
schema_version: 1
# Design fields this template honors (spec §6). Tool-level fields (template, fit_one_page,
# fit_floor, font_paths) are not listed: the tool, not the template, consumes them.
# Layout/structure choices live in config.typ, not in the design block.
supported:
  - page
  - margins
  - fonts
  - sizes
  - spacing
  - colors
