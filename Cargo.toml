[package]
name = "cv"
version = "0.1.0"
edition = "2024"
description = "Code-first YAML to one-page PDF CV tool"
license = "MIT"

[lib]
name = "cv"
path = "src/lib.rs"

[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
# CLI parsing with the derive API (spec §2).
clap = { version = "4", features = ["derive"] }
# Serialization derives for the YAML data model (spec §2).
serde = { version = "1", features = ["derive"] }
# Actively maintained fork of the archived serde_yaml, for parsing user YAML (spec §2).
serde_yaml_ng = "0.10"
# JSON building for derived schema fragments of custom value types (spec §2).
serde_json = "1"
# JSON Schema derived from the Rust model structs, never hand-written (spec §2).
schemars = "1"
# Rich diagnostics with source spans for user-facing errors (spec §2, §5). `fancy`
# enables the graphical (snippet + label) report handler used at the CLI boundary
# (ADR-0018); this is the toplevel crate, so pulling its deps is acceptable.
miette = { version = "7", features = ["fancy"] }
# YAML event stream with byte spans (SpannedEventReceiver): serde_yaml_ng only exposes
# locations on errors, not per-value spans, so M2 semantic checks (bad font, bad URL,
# duplicate titles) get their spans from a second, span-annotated parse (ADR-0014).
saphyr-parser = "0.3"
# Ergonomic error enum definitions (spec §2).
thiserror = "2"
# Embeds templates and fonts into the single binary (spec §2, §10). include_dir over
# rust-embed: no proc-macro build step, identical behavior in debug and release builds
# (rust-embed re-reads from disk in debug, which would break template behavior parity).
include_dir = "0.7"
# Debounced file watching for `cv watch` (spec §2, M5).
notify = "8"
# Atomic PDF writes: temp file in the output directory, then rename (spec §3 output rules).
tempfile = "3"

# Rendering engine, pinned exactly per plan 1.4.1. Verified on crates.io/docs.rs:
# typst-as-lib 0.17.0 declares typst ^0.15, so these versions are mutually compatible.
typst = "=0.15.1"
typst-pdf = "=0.15.1"
# System font discovery (spec §2, §8).
typst-kit = "=0.15.1"
# typst-as-lib: World/glue library for in-memory Typst compilation (spec §2, §9).
# Supports the pinned typst 0.15 (verified: its 0.17.0 release requires typst ^0.15).
# `typst-kit-fonts` enables system font discovery via typst-kit (spec §8).
typst-as-lib = { version = "0.17", features = ["typst-kit-fonts"] }

[dev-dependencies]
# Temporary directories for CLI end-to-end tests.
tempfile = "3"
# Extracting text from generated PDFs to assert on selectable content (spec §11).
pdf-extract = "0.12"
# Snapshot tests for error output and the JSON Schema (spec §11, plan 2.7/2.8).
insta = "1"

[profile.release]
# Deterministic, reproducible release binaries.
strip = true
